<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tower of Hanoi Visualizer</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body>

  <div class="container">
    <header>
      <h1>Tower of Hanoi Visualizer</h1>
      <p class="subtitle">Recursive $2^n - 1$ steps solved in Python via WebAssembly</p>
    </header>

    <div class="grid">
      <!-- Controls -->
      <div class="card controls-card">
        <h2>Configuration</h2>
        <div class="form-group">
          <label for="diskCount">Number of Disks ($n$):</label>
          <input type="number" id="diskCount" value="3" min="1" max="8" />
        </div>

        <div class="btn-group">
          <button class="primary-btn" id="solveBtn" onclick="runSolver()">Solve &amp; Animate</button>
          <button class="secondary-btn" id="pauseBtn" onclick="togglePause()" disabled>Pause</button>
          <button class="secondary-btn" onclick="resetVisualizer()">Reset</button>
        </div>

        <div class="slider-group">
          <label for="speedSlider">Animation Speed:</label>
          <input type="range" id="speedSlider" min="50" max="1000" value="400" />
        </div>

        <div class="meta-box">
          <div><strong>Total Moves ($2^n - 1$):</strong> <span id="totalMoves">0</span></div>
          <div><strong>Current Move:</strong> <span id="currentMove">0</span></div>
        </div>

        <div id="status">Loading Python runtime...</div>
      </div>

      <!-- Canvas Display -->
      <div class="card canvas-card">
        <canvas id="hanoiCanvas" width="600" height="280"></canvas>
      </div>
    </div>

    <!-- Raw String Output -->
    <div class="card text-card">
      <h2>Curriculum Output (hanoi_solver)</h2>
      <pre id="outputLog">Output will render here.</pre>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
